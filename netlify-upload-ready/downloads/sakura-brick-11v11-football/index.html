<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Sakura Brick 11v11 Football, a quick-match Three.js football game with cinematic camera, difficulty settings, and Sakura Brick scenery.">
  <meta name="theme-color" content="#101820">
  <meta property="og:title" content="Sakura Brick 11v11 Football">
  <meta property="og:description" content="A browser-playable 11v11 Three.js football game.">
  <meta property="og:type" content="website">
  <title>Sakura Brick 11v11 Football</title>
  <style>
    :root {
      color-scheme: dark;
      --home: #2f7df6;
      --away: #f04c45;
      --accent: #f3c944;
      --ink: rgba(9, 15, 22, 0.78);
      --line: rgba(255, 255, 255, 0.22);
      --text: #f7fbff;
      --muted: rgba(247, 251, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101820;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 16px;
      left: 50%;
      display: grid;
      grid-template-columns: minmax(70px, auto) auto minmax(70px, auto);
      align-items: center;
      gap: 10px;
      min-width: min(440px, calc(100vw - 24px));
      transform: translateX(-50%);
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .team.away {
      justify-content: flex-end;
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.72);
    }

    .dot.home {
      background: var(--home);
    }

    .dot.away {
      background: var(--away);
    }

    .scorebox {
      display: grid;
      grid-template-columns: 44px 58px 44px;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-align: center;
    }

    .score {
      padding: 5px 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.13);
      font-size: 26px;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .clock {
      padding: 5px 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .panel {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: min(376px, calc(100vw - 32px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.26);
    }

    .player-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      min-width: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .player-line strong {
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .difficulty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 0 10px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(56px, 1fr));
      gap: 3px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: auto;
    }

    .segmented button {
      min-height: 26px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .segmented button.active {
      background: var(--accent);
      color: #1a1b13;
    }

    .bar {
      position: relative;
      height: 10px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
    }

    .bar span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #fff0a8);
      transition: width 80ms linear;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .key {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.86);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%) scale(0.88);
      opacity: 0;
      padding: 16px 24px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 8px;
      background: rgba(9, 15, 22, 0.82);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
      color: #fff;
      font-size: clamp(28px, 6vw, 72px);
      font-weight: 1000;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
    }

    .toast.show {
      animation: goalToast 1.45s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
    }

    .toast small {
      display: block;
      margin-top: 4px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .center-message {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(540px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(9, 15, 22, 0.72);
      backdrop-filter: blur(14px);
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    @keyframes goalToast {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72);
      }
      16%,
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -62%) scale(1.08);
      }
    }

    @media (max-width: 720px) {
      .topbar {
        top: 8px;
        min-width: calc(100vw - 16px);
      }

      .team {
        font-size: 11px;
      }

      .scorebox {
        grid-template-columns: 34px 48px 34px;
        gap: 5px;
      }

      .score {
        font-size: 22px;
      }

      .clock {
        font-size: 14px;
      }

      .panel {
        left: 8px;
        bottom: 8px;
        width: calc(100vw - 16px);
      }

      .center-message {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div class="topbar">
      <div class="team"><span class="dot home"></span><span>Home</span></div>
      <div class="scorebox">
        <div class="score" id="homeScore">0</div>
        <div class="clock" id="clock">3:00</div>
        <div class="score" id="awayScore">0</div>
      </div>
      <div class="team away"><span>Away</span><span class="dot away"></span></div>
    </div>

    <div class="panel">
      <div class="player-line">
        <span>Selected</span>
        <strong id="selectedName">Home 8</strong>
      </div>
      <div class="player-line">
        <span>Possession</span>
        <strong id="possession">Loose ball</strong>
      </div>
      <div class="difficulty-row">
        <span>Difficulty</span>
        <div class="segmented" role="group" aria-label="Difficulty">
          <button type="button" data-difficulty="easy">Easy</button>
          <button type="button" data-difficulty="normal" class="active">Normal</button>
          <button type="button" data-difficulty="hard">Hard</button>
        </div>
      </div>
      <div class="bar" title="Shot charge"><span id="chargeBar"></span></div>
      <div class="keys">
        <div class="key">WASD</div>
        <div class="key">Shift</div>
        <div class="key">J Pass</div>
        <div class="key">K Through</div>
        <div class="key">Space</div>
        <div class="key">Q Switch</div>
        <div class="key">R Kickoff</div>
        <div class="key">C Camera</div>
        <div class="key">Gamepad</div>
      </div>
    </div>

    <div class="toast" id="toast">Goal<small>Sakura Brick</small></div>
    <div class="center-message" id="message">WASD move, Shift sprint, J pass, K through ball, hold Space for a charged shot, C toggles camera.</div>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script>

    const PITCH = { width: 68, length: 110, halfW: 34, halfL: 55 };
    const PENALTY = { depth: 16.5, width: 40 };
    const GOAL = { width: 14, depth: 4.5, height: 4.2 };
    const PLAYER_RADIUS = 1.05;
    const MATCH_SECONDS = 180;
    const HOME = 0;
    const AWAY = 1;
    const DIFFICULTY = {
      easy: {
        label: 'Easy',
        speed: 0.76,
        chase: 0.72,
        stealRange: 2.05,
        steal: 0.42,
        boost: 2.4,
        shoot: 0.58,
        pass: 0.62,
        shotPower: 0.78,
        attack: 0.76
      },
      normal: {
        label: 'Normal',
        speed: 1,
        chase: 1,
        stealRange: 2.55,
        steal: 1,
        boost: 4.2,
        shoot: 1,
        pass: 1,
        shotPower: 1,
        attack: 1
      },
      hard: {
        label: 'Hard',
        speed: 1.18,
        chase: 1.28,
        stealRange: 3.05,
        steal: 1.65,
        boost: 5.8,
        shoot: 1.45,
        pass: 1.25,
        shotPower: 1.18,
        attack: 1.2
      }
    };
    const COLORS = {
      home: 0x2f7df6,
      away: 0xf04c45,
      accent: 0xf3c944,
      keeper: 0xf3c944,
      skin: 0xffcda7,
      line: 0xf7fbff,
      brick: 0xb94834,
      darkBrick: 0x7f2e27,
      wood: 0x6e3522,
      water: 0x4fb7c9,
      sakura: 0xff9ab7
    };

    const app = document.getElementById('app');
    const homeScoreEl = document.getElementById('homeScore');
    const awayScoreEl = document.getElementById('awayScore');
    const clockEl = document.getElementById('clock');
    const selectedNameEl = document.getElementById('selectedName');
    const possessionEl = document.getElementById('possession');
    const chargeBarEl = document.getElementById('chargeBar');
    const toastEl = document.getElementById('toast');
    const messageEl = document.getElementById('message');
    const difficultyButtons = document.querySelectorAll('[data-difficulty]');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc7e2);
    scene.fog = new THREE.Fog(0x9bc7e2, 95, 185);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 520);
    camera.position.set(0, 66, 76);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x5a6b48, 2.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 2.8);
    sun.position.set(-52, 86, 38);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -92;
    sun.shadow.camera.right = 92;
    sun.shadow.camera.top = 92;
    sun.shadow.camera.bottom = -92;
    sun.shadow.camera.near = 8;
    sun.shadow.camera.far = 180;
    scene.add(sun);

    const state = {
      homeScore: 0,
      awayScore: 0,
      selected: 8,
      possession: null,
      lastTouch: null,
      ballVelocity: new THREE.Vector3(),
      keys: new Set(),
      clock: MATCH_SECONDS,
      pausedTimer: 0,
      ended: false,
      shotCharging: false,
      shotCharge: 0,
      gamepadLatch: {},
      kickoffTeam: HOME,
      cinematicCamera: true,
      cameraOrbit: 0,
      difficulty: 'normal'
    };

    const playerGeo = new THREE.CapsuleGeometry(0.78, 1.55, 5, 12);
    const headGeo = new THREE.SphereGeometry(0.72, 18, 14);
    const hairGeo = new THREE.SphereGeometry(0.74, 18, 8, 0, Math.PI * 2, 0, Math.PI * 0.52);
    const neckGeo = new THREE.CylinderGeometry(0.22, 0.24, 0.42, 10);
    const markerGeo = new THREE.TorusGeometry(1.7, 0.07, 8, 48);
    const playerMaterials = {
      home: new THREE.MeshStandardMaterial({ color: COLORS.home, roughness: 0.55, metalness: 0.02 }),
      away: new THREE.MeshStandardMaterial({ color: COLORS.away, roughness: 0.55, metalness: 0.02 }),
      keeper: new THREE.MeshStandardMaterial({ color: COLORS.keeper, roughness: 0.5, metalness: 0.02 }),
      skin: new THREE.MeshStandardMaterial({ color: COLORS.skin, roughness: 0.72 }),
      hair: new THREE.MeshStandardMaterial({ color: 0x2c1d18, roughness: 0.82 }),
      socksHome: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62 }),
      socksAway: new THREE.MeshStandardMaterial({ color: 0x2a1010, roughness: 0.62 })
    };

    const players = [];
    const tempV = new THREE.Vector3();
    const tempV2 = new THREE.Vector3();
    const forwardHome = new THREE.Vector3(0, 0, -1);
    const forwardAway = new THREE.Vector3(0, 0, 1);
    const ball = createBall();

    createWorld();
    createTeams();
    resetKickoff();
    updateHud();

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', (event) => {
      const key = normalizeKey(event);
      state.keys.add(key);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) event.preventDefault();
      if (key === 'KeyQ') switchPlayer();
      if (key === 'KeyJ') passBall(false);
      if (key === 'KeyK') passBall(true);
      if (key === 'KeyR') restartMatchPoint();
      if (key === 'KeyC') toggleCameraMode();
      if (key === 'Space' && !state.shotCharging) {
        state.shotCharging = true;
        state.shotCharge = 0;
      }
    });
    window.addEventListener('keyup', (event) => {
      const key = normalizeKey(event);
      state.keys.delete(key);
      if (key === 'Space' && state.shotCharging) shootBall();
    });
    difficultyButtons.forEach((button) => {
      button.addEventListener('click', () => setDifficulty(button.dataset.difficulty));
    });

    let lastTime = performance.now();
    requestAnimationFrame(loop);

    function normalizeKey(event) {
      if (event.code === 'Space') return 'Space';
      return event.code;
    }

    function loop(now) {
      const rawDt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      pollGamepad();
      update(rawDt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    function update(dt) {
      if (state.pausedTimer > 0) {
        state.pausedTimer -= dt;
        updateCamera(dt);
        animatePlayers(dt);
        return;
      }

      if (!state.ended) {
        state.clock = Math.max(0, state.clock - dt);
        if (state.clock <= 0) {
          state.ended = true;
          messageEl.textContent = finalMessage();
          showToast('Full Time', `${state.homeScore} - ${state.awayScore}`);
        }
      }

      if (state.shotCharging) {
        state.shotCharge = Math.min(1, state.shotCharge + dt / 1.05);
      }

      updatePlayers(dt);
      updateBall(dt);
      resolvePlayerCollisions();
      checkPossession();
      checkGoal();
      updateCamera(dt);
      animatePlayers(dt);
      updateHud();
    }

    function createWorld() {
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x6c8c58, roughness: 0.9 });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 210), groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.03;
      ground.receiveShadow = true;
      scene.add(ground);

      createPitch();
      createGoals();
      createToriiGate();
      createPagoda();
      createLotusPond();
      createSakuraGarden();
      createBrickWalks();
      createClouds();
    }

    function createPitch() {
      const stripeA = new THREE.MeshStandardMaterial({ color: 0x2f8f45, roughness: 0.82 });
      const stripeB = new THREE.MeshStandardMaterial({ color: 0x287d3d, roughness: 0.86 });
      const bandLength = PITCH.length / 12;
      for (let i = 0; i < 12; i++) {
        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(PITCH.width, bandLength + 0.04), i % 2 ? stripeA : stripeB);
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(0, 0, -PITCH.halfL + bandLength * i + bandLength / 2);
        stripe.receiveShadow = true;
        scene.add(stripe);
      }

      const lineMat = new THREE.MeshBasicMaterial({ color: COLORS.line });
      addLineRect(0, 0, PITCH.width, PITCH.length, lineMat, 0.08);
      addLine(0, 0, PITCH.width, 0, lineMat, 0.08);
      addCircle(0, 0, 9.15, lineMat, 0.08);
      addSpot(0, 0, 0.26, lineMat);
      addSpot(0, -44, 0.26, lineMat);
      addSpot(0, 44, 0.26, lineMat);
      addLineRect(0, -PITCH.halfL + PENALTY.depth / 2, PENALTY.width, PENALTY.depth, lineMat, 0.08);
      addLineRect(0, PITCH.halfL - PENALTY.depth / 2, PENALTY.width, PENALTY.depth, lineMat, 0.08);
      addLineRect(0, -PITCH.halfL + 5.5 / 2, 18.32, 5.5, lineMat, 0.08);
      addLineRect(0, PITCH.halfL - 5.5 / 2, 18.32, 5.5, lineMat, 0.08);
      addPenaltyArc(0, -44, 9.15, 0.21, Math.PI - 0.21, lineMat);
      addPenaltyArc(0, 44, 9.15, Math.PI + 0.21, Math.PI * 2 - 0.21, lineMat);

      for (const x of [-PITCH.halfW, PITCH.halfW]) {
        const boards = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.1, PITCH.length + 8),
          new THREE.MeshStandardMaterial({ color: 0x22313b, roughness: 0.58 })
        );
        boards.position.set(x + Math.sign(x) * 1.6, 0.55, 0);
        boards.castShadow = true;
        boards.receiveShadow = true;
        scene.add(boards);
      }
    }

    function addLineRect(cx, cz, width, length, material, thickness) {
      addLine(cx - width / 2, cz - length / 2, cx + width / 2, cz - length / 2, material, thickness);
      addLine(cx + width / 2, cz - length / 2, cx + width / 2, cz + length / 2, material, thickness);
      addLine(cx + width / 2, cz + length / 2, cx - width / 2, cz + length / 2, material, thickness);
      addLine(cx - width / 2, cz + length / 2, cx - width / 2, cz - length / 2, material, thickness);
    }

    function addLine(x1, z1, x2, z2, material, thickness) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(thickness, length), material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = -Math.atan2(dx, dz);
      mesh.position.set((x1 + x2) / 2, 0.032, (z1 + z2) / 2);
      scene.add(mesh);
    }

    function addCircle(x, z, radius, material, thickness) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(radius - thickness / 2, radius + thickness / 2, 96), material);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(x, 0.034, z);
      scene.add(ring);
    }

    function addPenaltyArc(x, z, radius, start, end, material) {
      const points = [];
      for (let i = 0; i <= 40; i++) {
        const t = start + (end - start) * (i / 40);
        points.push(new THREE.Vector3(x + Math.cos(t) * radius, 0.04, z + Math.sin(t) * radius));
      }
      const curve = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(curve, new THREE.LineBasicMaterial({ color: COLORS.line, linewidth: 2 }));
      scene.add(line);
    }

    function addSpot(x, z, radius, material) {
      const spot = new THREE.Mesh(new THREE.CircleGeometry(radius, 24), material);
      spot.rotation.x = -Math.PI / 2;
      spot.position.set(x, 0.036, z);
      scene.add(spot);
    }

    function createGoals() {
      createGoalAt(-PITCH.halfL - GOAL.depth / 2, Math.PI);
      createGoalAt(PITCH.halfL + GOAL.depth / 2, 0);
    }

    function createGoalAt(z, rotation) {
      const group = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0xf8fbff, roughness: 0.42 });
      const netMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, roughness: 0.85 });
      const postGeo = new THREE.CylinderGeometry(0.16, 0.16, GOAL.height, 16);
      const crossGeo = new THREE.CylinderGeometry(0.14, 0.14, GOAL.width, 16);

      for (const x of [-GOAL.width / 2, GOAL.width / 2]) {
        const post = new THREE.Mesh(postGeo, postMat);
        post.position.set(x, GOAL.height / 2, 0);
        post.castShadow = true;
        group.add(post);
      }

      const crossbar = new THREE.Mesh(crossGeo, postMat);
      crossbar.rotation.z = Math.PI / 2;
      crossbar.position.set(0, GOAL.height, 0);
      crossbar.castShadow = true;
      group.add(crossbar);

    function createBall() {

    function createTeams() {
      const homeFormation = [
        ['GK', 0, 50], ['LB', -22, 31], ['LCB', -8, 35], ['RCB', 8, 35], ['RB', 22, 31],
        ['LM', -24, 10], ['CM', -8, 8], ['CM', 8, 8], ['RM', 24, 10], ['ST', -7, -14], ['ST', 7, -14]
      ];
      const awayFormation = homeFormation.map(([role, x, z]) => [role, -x, -z]);
      homeFormation.forEach((entry, i) => players.push(createPlayer(HOME, i, entry)));
      awayFormation.forEach((entry, i) => players.push(createPlayer(AWAY, i, entry)));
    }

    function createPlayer(team, index, [role, x, z]) {
      const group = new THREE.Group();
      const isKeeper = role === 'GK';
      const bodyMat = isKeeper ? playerMaterials.keeper : team === HOME ? playerMaterials.home : playerMaterials.away;
      const body = new THREE.Mesh(playerGeo, bodyMat);
      body.position.y = 1.42;
      body.castShadow = true;
      group.add(body);

      const neck = new THREE.Mesh(neckGeo, playerMaterials.skin);
      neck.position.y = 2.62;
      neck.castShadow = true;
      group.add(neck);

      const head = new THREE.Mesh(headGeo, playerMaterials.skin);
      head.position.y = 3.14;
      head.castShadow = true;
      group.add(head);

      const hair = new THREE.Mesh(hairGeo, playerMaterials.hair);
      hair.position.y = 3.36;
      hair.castShadow = true;
      group.add(hair);

      const sockMat = team === HOME ? playerMaterials.socksHome : playerMaterials.socksAway;
      for (const lx of [-0.42, 0.42]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.9, 8), sockMat);
        leg.position.set(lx, 0.45, 0);
        leg.castShadow = true;
        group.add(leg);
      }

      const marker = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 }));
      marker.rotation.x = Math.PI / 2;
      marker.position.y = 0.08;
      group.add(marker);

      group.position.set(x, 0, z);
      scene.add(group);

      return {
        team,
        index,
        role,
        name: `${team === HOME ? 'Home' : 'Away'} ${index + 1} ${role}`,
        mesh: group,
        body,
        neck,
        head,
        hair,
        marker,
        home: new THREE.Vector3(x, 0, z),
        velocity: new THREE.Vector3(),
        target: new THREE.Vector3(x, 0, z),
        speed: isKeeper ? 12.5 : 14.5,
        sprint: isKeeper ? 16 : 19.5,
        hasBall: false,
        cooldown: 0,
        aiThink: 0,
        attackBoost: 0,
        legPhase: Math.random() * Math.PI * 2
      };
    }

    function updatePlayers(dt) {
      const selected = players[state.selected];
      const input = getMoveInput();
      const hasTeamInput = Math.hypot(input.x, input.z) > 0.04;
      const sprint = state.keys.has('ShiftLeft') || state.keys.has('ShiftRight') || gamepadPressed('RT');

      for (const p of players) {
        p.cooldown = Math.max(0, p.cooldown - dt);
        p.attackBoost = Math.max(0, p.attackBoost - dt);
        if (p.team === HOME && hasTeamInput) {
          controlHomeTeamPlayer(p, input, sprint, dt);
        } else if (p.team === HOME && p === selected) {
          controlPlayer(p, input, sprint, dt);
        } else if (p.team === HOME) {
          updateHomeSupport(p, dt);
        } else {
          updateAwayAI(p, dt);
        }
        clampPlayer(p);
        orientPlayer(p);
      }
    }

    function controlHomeTeamPlayer(player, input, sprint, dt) {
      const selected = players[state.selected];
      const isSelected = player === selected;
      const scale = isSelected ? 1 : player.role === 'GK' ? 0.38 : 0.72;
      const speed = (sprint ? player.sprint : player.speed) * scale;
      player.velocity.x = input.x * speed;
      player.velocity.z = input.z * speed;
      player.mesh.position.x += player.velocity.x * dt;
      player.mesh.position.z += player.velocity.z * dt;
      if (player.hasBall) carryBall(player);
    }

    function controlPlayer(player, input, sprint, dt) {
      const speed = sprint ? player.sprint : player.speed;
      player.velocity.x = input.x * speed;
      player.velocity.z = input.z * speed;
      player.mesh.position.x += player.velocity.x * dt;
      player.mesh.position.z += player.velocity.z * dt;
      if (player.hasBall) carryBall(player);
    }

    function updateHomeSupport(player, dt) {
      const ballPos = ball.position;
      let target = player.home.clone();
      target.z += THREE.MathUtils.clamp((ballPos.z - target.z) * 0.32, -18, 18);
      target.x += THREE.MathUtils.clamp((ballPos.x - target.x) * 0.18, -8, 8);

      if (state.possession && state.possession.team === AWAY) {
        const dist = distanceXZ(player.mesh.position, ballPos);
        if (dist < 19 && player.role !== 'GK') target.copy(ballPos);
      }
      moveToward(player, target, player.speed * 0.72, dt);
    }

    function updateAwayAI(player, dt) {
      player.aiThink -= dt;
      const difficulty = currentDifficulty();
      const ballPos = ball.position;
      if (tryStealBall(player, dt)) return;
      const attacking = state.possession && state.possession.team === AWAY;
      const defending = !attacking;

      if (player.hasBall) {
        awayOnBall(player, dt);
        return;
      }

      let target = player.home.clone();
      target.z += THREE.MathUtils.clamp((ballPos.z - target.z) * 0.38, -20, 20);
      target.x += THREE.MathUtils.clamp((ballPos.x - target.x) * 0.18, -9, 9);

      if (defending) {
        const closestAway = closestPlayerToBall(AWAY);
        if (closestAway === player && player.role !== 'GK') {
          target.copy(ballPos);
        }
        if (state.possession && state.possession.team === HOME && player.role !== 'GK') {
          target.copy(state.possession.mesh.position);
        }
      }

      if (attacking && player.role !== 'GK') {
        target.z += 8 * difficulty.attack;
        if (Math.abs(target.x) < 7) target.x += player.index % 2 ? 5 : -5;
      }

      if (player.role === 'GK') {
        target.set(THREE.MathUtils.clamp(ballPos.x, -5.8, 5.8), 0, -49.5);
        if (ballPos.z < -39 && Math.abs(ballPos.x) < 16) target.z = THREE.MathUtils.clamp(ballPos.z, -52, -43);
      }

      const chaseMultiplier = state.possession && state.possession.team === HOME ? difficulty.chase : difficulty.speed;
      moveToward(player, target, player.speed * 0.82 * chaseMultiplier, dt);
    }

    function tryStealBall(player, dt) {
      const difficulty = currentDifficulty();
      if (player.team !== AWAY || player.role === 'GK' || player.cooldown > 0) return false;
      const holder = state.possession;
      if (!holder || holder.team !== HOME) return false;
      const dist = distanceXZ(player.mesh.position, holder.mesh.position);
      if (dist > difficulty.stealRange) return false;
      const closestAway = closestPlayerToBall(AWAY);
      if (closestAway !== player && dist > 1.85) return false;
      const tackleChance = dist < 1.65 ? difficulty.steal : dt * 3.8 * difficulty.steal;
      if (Math.random() > tackleChance) return false;

      holder.hasBall = false;
      holder.cooldown = 0.85;
      player.cooldown = 0.18;
      player.attackBoost = difficulty.boost;
      state.possession = null;
      setPossession(player);
      messageEl.textContent = `${player.name} steals it and breaks toward goal.`;
      return true;
    }

    function awayOnBall(player, dt) {
      const difficulty = currentDifficulty();
      const goal = new THREE.Vector3(0, 0, PITCH.halfL + 2);
      const distGoal = distanceXZ(player.mesh.position, goal);
      const pressure = nearestOpponentDistance(player);
      const boosted = player.attackBoost > 0;
      if ((distGoal < 34 && boosted && Math.random() < dt * 3.4 * difficulty.shoot) || (distGoal < 27 && Math.random() < dt * 1.8 * difficulty.shoot) || (distGoal < 18 && pressure < 4)) {
        aiShoot(player);
        return;
      }
      if (!boosted && ((pressure < 5.3 && Math.random() < dt * 2.8 * difficulty.pass) || Math.random() < dt * 0.28 * difficulty.pass)) {
        aiPass(player);
        return;
      }
      const lane = goal.clone();
      lane.x += Math.sin(performance.now() * 0.001 + player.index) * (boosted ? 3.5 : 7);
      moveToward(player, lane, player.sprint * (boosted ? 1.08 : 0.78) * difficulty.attack, dt);
      carryBall(player);
    }

    function moveToward(player, target, speed, dt) {
      tempV.copy(target).sub(player.mesh.position);
      tempV.y = 0;
      const dist = tempV.length();
      if (dist > 0.12) {
        tempV.normalize();
        player.velocity.copy(tempV).multiplyScalar(speed);
        player.mesh.position.addScaledVector(tempV, Math.min(dist, speed * dt));
      } else {
        player.velocity.multiplyScalar(0.75);
      }
    }

    function clampPlayer(player) {
      const padding = player.role === 'GK' ? 1 : 2;
      player.mesh.position.x = THREE.MathUtils.clamp(player.mesh.position.x, -PITCH.halfW + padding, PITCH.halfW - padding);
      if (player.role === 'GK') {
        if (player.team === HOME) player.mesh.position.z = THREE.MathUtils.clamp(player.mesh.position.z, 39, 53);
        else player.mesh.position.z = THREE.MathUtils.clamp(player.mesh.position.z, -53, -39);
      } else {
        player.mesh.position.z = THREE.MathUtils.clamp(player.mesh.position.z, -PITCH.halfL + padding, PITCH.halfL - padding);
      }
    }

    function orientPlayer(player) {
      const v = player.velocity;
      if (Math.hypot(v.x, v.z) > 0.4) {
        player.mesh.rotation.y = Math.atan2(v.x, v.z);
      }
      player.marker.material.opacity = player === players[state.selected] ? 0.95 : 0;
      player.marker.material.color.set(player.hasBall ? COLORS.accent : 0xffffff);
    }

    function animatePlayers(dt) {
      for (const p of players) {
        const speed = Math.hypot(p.velocity.x, p.velocity.z);
        p.legPhase += dt * speed * 2.8;
        const bob = Math.sin(p.legPhase) * Math.min(0.12, speed * 0.01);
        p.body.position.y = 1.42 + bob;
        p.neck.position.y = 2.62 + bob;
        p.head.position.y = 3.14 + bob;
        p.hair.position.y = 3.36 + bob;
      }
      ball.children[0].rotation.x += state.ballVelocity.z * dt * 1.4;
      ball.children[0].rotation.z -= state.ballVelocity.x * dt * 1.4;
      ball.children[1].rotation.y += dt * 4;
    }

    function updateBall(dt) {
      if (state.possession) {
        carryBall(state.possession);
        return;
      }
      ball.position.addScaledVector(state.ballVelocity, dt);
      state.ballVelocity.multiplyScalar(Math.pow(0.55, dt));
      if (state.ballVelocity.length() < 0.18) state.ballVelocity.set(0, 0, 0);

      const maxX = PITCH.halfW - 0.62;
      if (Math.abs(ball.position.x) > maxX) {
        ball.position.x = THREE.MathUtils.clamp(ball.position.x, -maxX, maxX);
        state.ballVelocity.x *= -0.56;
      }

      const inGoalMouth = Math.abs(ball.position.x) < GOAL.width / 2;
      if (!inGoalMouth && Math.abs(ball.position.z) > PITCH.halfL - 0.62) {
        ball.position.z = THREE.MathUtils.clamp(ball.position.z, -PITCH.halfL + 0.62, PITCH.halfL - 0.62);
        state.ballVelocity.z *= -0.48;
      }
      ball.position.y = 0.65 + Math.max(0, Math.min(1.2, state.ballVelocity.length() * 0.012));
    }

    function carryBall(player) {
      const dir = facingDirection(player);
      ball.position.copy(player.mesh.position).addScaledVector(dir, 1.65);
      ball.position.y = 0.65;
      state.ballVelocity.copy(player.velocity);
    }

    function facingDirection(player) {
      if (player.role === 'GK') return player.team === HOME ? forwardHome : forwardAway;
      const angle = player.mesh.rotation.y;
      tempV2.set(Math.sin(angle), 0, Math.cos(angle));
      if (tempV2.lengthSq() < 0.1) tempV2.copy(player.team === HOME ? forwardHome : forwardAway);
      return tempV2.normalize();
    }

    function checkPossession() {
      if (state.possession) return;
      let best = null;
      let bestDist = 1.9;
      for (const p of players) {
        const dist = distanceXZ(p.mesh.position, ball.position);
        if (dist < bestDist && p.cooldown <= 0) {
          best = p;
          bestDist = dist;
        }
      }
      if (best) setPossession(best);
    }

    function setPossession(player) {
      players.forEach((p) => p.hasBall = false);
      state.possession = player;
      state.lastTouch = player;
      player.hasBall = true;
      state.ballVelocity.set(0, 0, 0);
      if (player.role === 'GK') keeperClear(player);
      if (player.team === HOME && players[state.selected].team !== HOME) state.selected = player.index;
    }

    function clearPossession(kicker) {
      if (state.possession) {
        state.possession.hasBall = false;
        state.possession.cooldown = 0.32;
        state.lastTouch = state.possession;
      }
      if (kicker) {
        kicker.hasBall = false;
        kicker.cooldown = 0.32;
        state.lastTouch = kicker;
      }
      state.possession = null;
    }

    function resolvePlayerCollisions() {
      for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
          const a = players[i];
          const b = players[j];
          const dx = b.mesh.position.x - a.mesh.position.x;
          const dz = b.mesh.position.z - a.mesh.position.z;
          const dist = Math.hypot(dx, dz);
          const minDist = PLAYER_RADIUS * 1.7;
          if (dist > 0 && dist < minDist) {
            const push = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const nz = dz / dist;
            a.mesh.position.x -= nx * push;
            a.mesh.position.z -= nz * push;
            b.mesh.position.x += nx * push;
            b.mesh.position.z += nz * push;
          }
        }
      }
    }

    function keeperClear(player) {
      const dir = player.team === HOME ? forwardHome : forwardAway;
      clearPossession(player);
      ball.position.copy(player.mesh.position).addScaledVector(dir, 2.4);
      ball.position.x = THREE.MathUtils.clamp(ball.position.x, -10, 10);
      ball.position.z = player.team === HOME ? Math.min(ball.position.z, PITCH.halfL - 7) : Math.max(ball.position.z, -PITCH.halfL + 7);
      ball.position.y = 1.05;
      state.ballVelocity.set((Math.random() - 0.5) * 6, 0, player.team === HOME ? -31 : 31);
      player.cooldown = 0.7;
      messageEl.textContent = `${player.name} clears the danger.`;
    }

    function checkGoal() {
      if (Math.abs(ball.position.x) > GOAL.width / 2) return;
      if (ball.position.z < -PITCH.halfL - 0.15) {
        if (state.lastTouch && state.lastTouch.role === 'GK' && state.lastTouch.team === AWAY) {
          keeperClear(state.lastTouch);
          return;
        }
        scoreGoal(HOME);
      } else if (ball.position.z > PITCH.halfL + 0.15) {
        if (state.lastTouch && state.lastTouch.role === 'GK' && state.lastTouch.team === HOME) {
          keeperClear(state.lastTouch);
          return;
        }
        scoreGoal(AWAY);
      }
    }

    function scoreGoal(team) {
      if (state.pausedTimer > 0) return;
      if (team === HOME) state.homeScore += 1;
      else state.awayScore += 1;
      state.kickoffTeam = team === HOME ? AWAY : HOME;
      showToast('Goal', team === HOME ? 'Home Sakura' : 'Away Brick');
      messageEl.textContent = `${team === HOME ? 'Home' : 'Away'} scores. Kickoff is resetting.`;
      updateHud();
      state.pausedTimer = 2.1;
      setTimeout(() => resetKickoff(), 1700);
    }

    function passBall(through) {
      const p = players[state.selected];
      if (!p || !p.hasBall || state.ended) return;
      const target = choosePassTarget(p, through);
      if (!target) return;
      clearPossession(p);
      tempV.copy(target.mesh.position).sub(p.mesh.position);
      tempV.y = 0;
      if (through) {
        tempV.z += p.team === HOME ? -9 : 9;
        tempV.x += target.velocity.x * 0.25;
      }
      tempV.normalize();
      state.ballVelocity.copy(tempV).multiplyScalar(through ? 33 : 25);
      ball.position.copy(p.mesh.position).addScaledVector(tempV, 1.9);
      ball.position.y = 0.72;
    }

    function shootBall() {
      const p = players[state.selected];
      state.shotCharging = false;
      if (!p || !p.hasBall || state.ended) {
        state.shotCharge = 0;
        return;
      }
      const goalZ = p.team === HOME ? -PITCH.halfL - 4 : PITCH.halfL + 4;
      tempV.set(-p.mesh.position.x * 0.14, 0, goalZ - p.mesh.position.z).normalize();
      const power = 33 + state.shotCharge * 34;
      clearPossession(p);
      state.ballVelocity.copy(tempV).multiplyScalar(power);
      ball.position.copy(p.mesh.position).addScaledVector(tempV, 1.9);
      ball.position.y = 0.88 + state.shotCharge * 0.45;
      state.shotCharge = 0;
    }

    function aiShoot(player) {
      const difficulty = currentDifficulty();
      const goalZ = PITCH.halfL + 4;
      tempV.set(-player.mesh.position.x * 0.16 + (Math.random() - 0.5) * 0.16, 0, goalZ - player.mesh.position.z).normalize();
      const boosted = player.attackBoost > 0;
      clearPossession(player);
      state.ballVelocity.copy(tempV).multiplyScalar(((boosted ? 48 : 38) + Math.random() * (boosted ? 18 : 16)) * difficulty.shotPower);
      ball.position.copy(player.mesh.position).addScaledVector(tempV, 1.9);
      ball.position.y = boosted ? 1.22 : 0.95;
      player.attackBoost = 0;
    }

    function aiPass(player) {
      const mates = players
        .filter((p) => p.team === AWAY && p !== player && p.role !== 'GK')
        .sort((a, b) => b.mesh.position.z - a.mesh.position.z);
      const target = mates.find((p) => p.mesh.position.z > player.mesh.position.z - 3) || mates[0];
      if (!target) return;
      clearPossession(player);
      tempV.copy(target.mesh.position).sub(player.mesh.position);
      tempV.z += 5;
      tempV.y = 0;
      tempV.normalize();
      state.ballVelocity.copy(tempV).multiplyScalar(24 + Math.random() * 7);
      ball.position.copy(player.mesh.position).addScaledVector(tempV, 1.85);
      ball.position.y = 0.75;
    }

    function choosePassTarget(player, through) {
      const mates = players.filter((p) => p.team === player.team && p !== player);
      const forward = player.team === HOME ? -1 : 1;
      const aim = facingDirection(player);
      let best = null;
      let bestScore = -Infinity;
      for (const mate of mates) {
        tempV.copy(mate.mesh.position).sub(player.mesh.position);
        tempV.y = 0;
        const dist = tempV.length();
        if (dist < 4 || dist > 52) continue;
        tempV.normalize();
        const facing = tempV.dot(aim);
        const progress = (mate.mesh.position.z - player.mesh.position.z) * forward;
        const score = facing * 1.8 + progress * (through ? 0.06 : 0.025) - Math.abs(mate.mesh.position.x - player.mesh.position.x) * 0.01 - dist * 0.01;
        if (score > bestScore) {
          best = mate;
          bestScore = score;
        }
      }
      return best;
    }

    function switchPlayer() {
      const homePlayers = players.filter((p) => p.team === HOME && p.role !== 'GK');
      let best = homePlayers[0];
      let bestScore = Infinity;
      for (const p of homePlayers) {
        const dist = distanceXZ(p.mesh.position, ball.position);
        if (dist < bestScore && p.index !== state.selected) {
          best = p;
          bestScore = dist;
        }
      }
      if (best) state.selected = best.index;
      updateHud();
    }

    function closestPlayerToBall(team) {
      let best = null;
      let bestDist = Infinity;
      for (const p of players) {
        if (p.team !== team) continue;
        const d = distanceXZ(p.mesh.position, ball.position);
        if (d < bestDist) {
          best = p;
          bestDist = d;
        }
      }
      return best;
    }

    function nearestOpponentDistance(player) {
      let best = Infinity;
      for (const p of players) {
        if (p.team === player.team) continue;
        best = Math.min(best, distanceXZ(p.mesh.position, player.mesh.position));
      }
      return best;
    }

    function distanceXZ(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }

    function getMoveInput() {
      let x = 0;
      let z = 0;
      if (state.keys.has('KeyA') || state.keys.has('ArrowLeft')) x -= 1;
      if (state.keys.has('KeyD') || state.keys.has('ArrowRight')) x += 1;
      if (state.keys.has('KeyW') || state.keys.has('ArrowUp')) z -= 1;
      if (state.keys.has('KeyS') || state.keys.has('ArrowDown')) z += 1;
      const pad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
      if (pad) {
        const dead = 0.18;
        const ax = Math.abs(pad.axes[0]) > dead ? pad.axes[0] : 0;
        const az = Math.abs(pad.axes[1]) > dead ? pad.axes[1] : 0;
        x += ax;
        z += az;
      }
      const len = Math.hypot(x, z);
      if (len > 1) {
        x /= len;
        z /= len;
      }
      return { x, z };
    }

    function pollGamepad() {
      const pad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
      if (!pad) return;
      buttonEdge(pad, 0, 'A', switchPlayer);
      buttonEdge(pad, 3, 'Y', () => passBall(false));
      buttonEdge(pad, 1, 'B', () => passBall(true));
      buttonEdge(pad, 4, 'LB', () => {
        if (state.possession === players[state.selected]) {
          state.shotCharging = true;
          state.shotCharge = Math.max(state.shotCharge, 0.65);
          shootBall();
        }
      });
    }

    function buttonEdge(pad, index, name, fn) {
      const pressed = !!pad.buttons[index]?.pressed;
      if (pressed && !state.gamepadLatch[name]) fn();
      state.gamepadLatch[name] = pressed;
    }

    function gamepadPressed(name) {
      const pad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
      if (!pad) return false;
      if (name === 'RT') return (pad.buttons[7]?.value || 0) > 0.35;
      return false;
    }

    function currentDifficulty() {
      return DIFFICULTY[state.difficulty] || DIFFICULTY.normal;
    }

    function setDifficulty(level) {
      if (!DIFFICULTY[level]) return;
      state.difficulty = level;
      updateDifficultyUi();
      messageEl.textContent = `${DIFFICULTY[level].label} difficulty selected.`;
    }

    function updateDifficultyUi() {
      difficultyButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.difficulty === state.difficulty);
      });
    }

    function restartMatchPoint() {
      if (state.ended) {
        state.homeScore = 0;
        state.awayScore = 0;
        state.clock = MATCH_SECONDS;
        state.ended = false;
        state.kickoffTeam = HOME;
        messageEl.textContent = 'New quick match started.';
      } else {
        messageEl.textContent = 'Kickoff restarted.';
      }
      resetKickoff();
      updateHud();
    }

    function toggleCameraMode() {
      state.cinematicCamera = !state.cinematicCamera;
      messageEl.textContent = state.cinematicCamera ? 'Cinematic camera on.' : 'Classic overhead camera on.';
    }

    function resetKickoff() {
      players.forEach((p) => {
        p.mesh.position.copy(p.home);
        p.velocity.set(0, 0, 0);
        p.hasBall = false;
        p.cooldown = 0.4;
        p.attackBoost = 0;
      });
      ball.position.set(0, 0.65, 0);
      state.ballVelocity.set(0, 0, 0);
      const kickoffPlayer = players.find((p) => p.team === state.kickoffTeam && p.role === 'ST') || players[state.kickoffTeam === HOME ? 9 : 20];
      setPossession(kickoffPlayer);
      if (state.kickoffTeam === HOME) state.selected = kickoffPlayer.index;
      else state.selected = 8;
      state.pausedTimer = Math.max(0, state.pausedTimer);
      updateHud();
    }

    function showToast(title, subtitle) {
      toastEl.innerHTML = `${title}<small>${subtitle}</small>`;
      toastEl.classList.remove('show');
      void toastEl.offsetWidth;
      toastEl.classList.add('show');
    }

    function finalMessage() {
      if (state.homeScore > state.awayScore) return 'Full time: Home wins the Sakura Brick quick match.';
      if (state.awayScore > state.homeScore) return 'Full time: Away wins the Sakura Brick quick match.';
      return 'Full time: the quick match ends level.';
    }

    function updateHud() {
      homeScoreEl.textContent = state.homeScore;
      awayScoreEl.textContent = state.awayScore;
      const seconds = Math.ceil(state.clock);
      const minutes = Math.floor(seconds / 60);
      const rest = String(seconds % 60).padStart(2, '0');
      clockEl.textContent = `${minutes}:${rest}`;
      const selected = players[state.selected];
      selectedNameEl.textContent = selected ? selected.name : 'Home';
      possessionEl.textContent = state.possession ? state.possession.name : 'Loose ball';
      chargeBarEl.style.width = `${Math.round(state.shotCharge * 100)}%`;
      updateDifficultyUi();
    }

    function updateCamera(dt) {
      const selected = players[state.selected] || players[8];
      const focus = state.possession ? state.possession.mesh.position : selected.mesh.position;
      if (state.cinematicCamera) {
        state.cameraOrbit += dt * 0.23;
        const attackingDir = state.possession && state.possession.team === AWAY ? 1 : -1;
        const side = Math.sin(state.cameraOrbit) * 18;
        const desired = new THREE.Vector3(
          THREE.MathUtils.clamp(focus.x * 0.45 + side, -36, 36),
          30 + Math.sin(state.cameraOrbit * 0.7) * 4,
          THREE.MathUtils.clamp(focus.z - attackingDir * 34 + 16, -64, 82)
        );
        camera.position.lerp(desired, 1 - Math.pow(0.006, dt));
        tempV.set(
          THREE.MathUtils.clamp((focus.x + ball.position.x) * 0.34, -20, 20),
          2.2,
          THREE.MathUtils.clamp((focus.z + ball.position.z) * 0.38, -48, 48)
        );
        camera.lookAt(tempV);
        return;
      }
      const target = new THREE.Vector3(
        THREE.MathUtils.clamp((focus.x + ball.position.x) * 0.22, -18, 18),
        62,
        THREE.MathUtils.clamp((focus.z + ball.position.z) * 0.32 + 47, -10, 74)
      );
      camera.position.lerp(target, 1 - Math.pow(0.001, dt));
      tempV.set(
        THREE.MathUtils.clamp((focus.x + ball.position.x) * 0.22, -16, 16),
        0,
        THREE.MathUtils.clamp((focus.z + ball.position.z) * 0.28, -42, 42)
      );
      camera.lookAt(tempV);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
