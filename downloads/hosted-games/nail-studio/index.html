<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nail Studio</title>
    <style>
      :root {
        --ink: #19171d;
        --pink: #ff5d8f;
        --blue: #75c7ff;
        --mint: #8cf0c7;
        --cream: #fff9ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff1f7, #e9fbff 58%, #fff2be);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1050px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 34px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 7vw, 4.8rem);
        line-height: 0.92;
      }

      .score {
        min-width: 150px;
        padding: 10px 12px;
        border: 3px solid #111;
        border-radius: 8px;
        background: #fff;
        font-weight: 900;
        text-align: center;
      }

      .game {
        display: grid;
        grid-template-columns: minmax(280px, 560px) minmax(0, 1fr);
        gap: 16px;
      }

      .table,
      .panel {
        border: 3px solid #111;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 8px 8px 0 rgba(17, 17, 17, 0.14);
      }

      .table {
        min-height: 560px;
        padding: 18px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.9) 0 55px, transparent 56px),
          linear-gradient(160deg, var(--blue), #ffe2ee 52%, #ffd166);
      }

      .hand {
        position: relative;
        width: min(100%, 430px);
        height: 440px;
        margin: 38px auto 0;
      }

      .palm {
        position: absolute;
        left: 94px;
        top: 156px;
        width: 240px;
        height: 220px;
        border: 4px solid #111;
        border-radius: 60px 60px 88px 88px;
        background: #e7ad87;
      }

      .finger {
        position: absolute;
        bottom: 200px;
        width: 66px;
        height: 210px;
        border: 4px solid #111;
        border-radius: 34px;
        background: #e7ad87;
      }

      .finger:nth-child(1) {
        left: 56px;
        height: 170px;
        transform: rotate(-10deg);
      }

      .finger:nth-child(2) {
        left: 122px;
      }

      .finger:nth-child(3) {
        left: 188px;
        height: 230px;
      }

      .finger:nth-child(4) {
        left: 254px;
        height: 200px;
      }

      .finger:nth-child(5) {
        left: 314px;
        height: 150px;
        transform: rotate(12deg);
      }

      .nail {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 34px;
        height: 48px;
        border: 3px solid #111;
        border-radius: 18px 18px 12px 12px;
        background: var(--pink);
        overflow: hidden;
      }

      .nail.stripes::before {
        content: "";
        position: absolute;
        inset: -10px;
        background: repeating-linear-gradient(45deg, transparent 0 9px, rgba(255, 255, 255, 0.82) 10px 15px);
      }

      .nail.dots::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #fff 0 4px, transparent 5px) 0 0 / 14px 14px;
      }

      .nail.sparkle::before {
        content: "* *";
        position: absolute;
        inset: 7px 3px;
        color: #fff;
        font-weight: 900;
        text-align: center;
      }

      .ring {
        position: absolute;
        left: 202px;
        top: 188px;
        width: 38px;
        height: 18px;
        border: 5px solid #ffd166;
        border-radius: 50%;
        background: transparent;
      }

      .caption {
        margin-top: 18px;
        padding: 12px;
        border: 3px solid #111;
        border-radius: 8px;
        background: #fff;
        font-weight: 850;
      }

      .panel {
        padding: 16px;
      }

      fieldset {
        margin: 0 0 14px;
        padding: 12px;
        border: 2px solid #111;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
      }

      legend {
        padding: 0 6px;
        font-weight: 900;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
        gap: 8px;
      }

      button {
        min-height: 42px;
        border: 2px solid #111;
        border-radius: 8px;
        background: #fff;
        color: #111;
        font: inherit;
        font-weight: 850;
        cursor: pointer;
      }

      button:hover,
      button.active {
        background: #111;
        color: #fff;
      }

      .swatch {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 6px;
        border: 2px solid #111;
        border-radius: 50%;
        vertical-align: -3px;
      }

      .finish {
        width: 100%;
        min-height: 52px;
        background: var(--pink);
      }

      @media (max-width: 760px) {
        header,
        .game {
          grid-template-columns: 1fr;
        }

        header {
          align-items: start;
        }

        .table {
          min-height: 500px;
        }

        .hand {
          transform: scale(0.88);
          transform-origin: top center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p><strong>MaxxGames</strong></p>
          <h1>Nail Studio</h1>
        </div>
        <div class="score" id="score">Clients: 0</div>
      </header>

      <section class="game" aria-label="Nail Studio game">
        <div class="table">
          <div class="hand" aria-label="Hand with custom nail art">
            <div class="finger"><div class="nail"></div></div>
            <div class="finger"><div class="nail"></div></div>
            <div class="finger"><div class="nail"></div></div>
            <div class="finger"><div class="nail"></div></div>
            <div class="finger"><div class="nail"></div></div>
            <div class="palm"></div>
            <div class="ring" id="ring"></div>
          </div>
          <p class="caption" id="caption">Choose polish, pattern, and ring color. Finish the set when it looks good.</p>
        </div>

        <div class="panel">
          <fieldset>
            <legend>Polish</legend>
            <div class="choices" data-kind="color">
              <button data-value="#ff5d8f" class="active"><span class="swatch" style="background:#ff5d8f"></span>Pink</button>
              <button data-value="#7c5cff"><span class="swatch" style="background:#7c5cff"></span>Purple</button>
              <button data-value="#2ec4b6"><span class="swatch" style="background:#2ec4b6"></span>Mint</button>
              <button data-value="#111111"><span class="swatch" style="background:#111111"></span>Black</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>Pattern</legend>
            <div class="choices" data-kind="pattern">
              <button data-value="" class="active">Gloss</button>
              <button data-value="stripes">Stripes</button>
              <button data-value="dots">Dots</button>
              <button data-value="sparkle">Sparkle</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>Ring</legend>
            <div class="choices" data-kind="ring">
              <button data-value="#ffd166" class="active">Gold</button>
              <button data-value="#c0c0c0">Silver</button>
              <button data-value="#ff5d8f">Pink</button>
              <button data-value="#7c5cff">Purple</button>
            </div>
          </fieldset>

          <button class="finish" id="finish">Finish Nails</button>
        </div>
      </section>
    </main>

    <script>
      const nails = [...document.querySelectorAll(".nail")];
      const ring = document.querySelector("#ring");
      const caption = document.querySelector("#caption");
      const score = document.querySelector("#score");
      let clients = 0;

      function setActive(button) {
        button.parentElement.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
      }

      document.querySelectorAll(".choices button").forEach((button) => {
        button.addEventListener("click", () => {
          setActive(button);
          const kind = button.parentElement.dataset.kind;
          if (kind === "color") {
            nails.forEach((nail, index) => {
              nail.style.background = index % 2 ? button.dataset.value : brighten(button.dataset.value);
            });
          }
          if (kind === "pattern") {
            nails.forEach((nail) => {
              nail.className = `nail ${button.dataset.value}`.trim();
            });
          }
          if (kind === "ring") {
            ring.style.borderColor = button.dataset.value;
          }
        });
      });

      function brighten(hex) {
        if (hex === "#111111") return "#3b3b3b";
        return hex;
      }

      document.querySelector("#finish").addEventListener("click", () => {
        clients += 1;
        score.textContent = `Clients: ${clients}`;
        const lines = [
          "Clean set. The client is taking pictures already.",
          "That combo is bright, neat, and totally wearable.",
          "The salon board just got another five-star look.",
          "Perfect polish. The ring color pulls it together."
        ];
        caption.textContent = lines[Math.floor(Math.random() * lines.length)];
      });
    </script>
  </body>
</html>
